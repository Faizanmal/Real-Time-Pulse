name: real-time-pulse-test

# Disposable integration database; no named volume. Removing the container
# removes this database. Published port is bound to loopback only.
services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pulse_test
      POSTGRES_PASSWORD: pulse_test_only_password
      POSTGRES_DB: pulse_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_test -d pulse_test"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-57379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
