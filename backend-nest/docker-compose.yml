name: real-time-pulse-local

# This file starts local development infrastructure only. The API runs on the host
# with `npm run start:dev`; this prevents an implicit backend image from booting.
services:
  postgres:
    image: postgres:15-alpine
    profiles: [local]
    environment:
      POSTGRES_USER: pulse_dev
      POSTGRES_PASSWORD: pulse_local_only_password
      POSTGRES_DB: pulse_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_dev -d pulse_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [local]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
