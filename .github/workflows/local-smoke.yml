name: Layered QA and chaos

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '15 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-unit:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend-nest/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: backend-nest
        run: npm ci

      - name: Backend typecheck and Prisma schema validation
        working-directory: backend-nest
        run: |
          npm run typecheck
          npm run prisma:validate

      - name: Security and tenant regression unit tests
        working-directory: backend-nest
        run: npm run test:ci:security-tenant

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Install E2E dependencies and validate Playwright test discovery
        working-directory: e2e
        run: |
          npm ci
          npx playwright test --config=playwright.smoke.config.ts --list

  db-integration:
    name: Disposable PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [static-unit]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pulse_test
          POSTGRES_PASSWORD: pulse_test_only_password
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse_test -d pulse_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend-nest/package-lock.json

      - name: Install backend dependencies
        working-directory: backend-nest
        run: npm ci

      - name: Apply migrations, seed fictional tenants and run database integration tests
        working-directory: backend-nest
        env:
          TEST_DATABASE_URL: postgresql://pulse_test:pulse_test_only_password@127.0.0.1:5432/pulse_test?schema=public
        run: npm run test:integration

  smoke-e2e:
    name: Multi-persona browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [static-unit, db-integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend-nest/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install application and E2E dependencies
        shell: bash
        run: |
          npm ci --prefix backend-nest
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run layered critical browser flows against loopback-only disposable services
        working-directory: e2e
        env:
          CI: 'true'
          TEST_POSTGRES_PORT: '55432'
          TEST_REDIS_PORT: '57379'
          TEST_DATABASE_URL: postgresql://pulse_test:pulse_test_only_password@127.0.0.1:55432/pulse_test?schema=public
        run: npm run test:smoke

      - name: Upload smoke diagnostics (fictional fixtures; credentials redacted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agency-client-smoke-report
          path: |
            e2e/test-results/smoke-report.json
            e2e/test-results/smoke-report/index.html
            e2e/test-results/smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  nightly-chaos:
    name: Nightly browser fault and load scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [smoke-e2e]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend-nest/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install application and E2E dependencies
        shell: bash
        run: |
          npm ci --prefix backend-nest
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Inject controlled 503, delayed recovery and 12-way overload/success mix
        working-directory: e2e
        env:
          CI: 'true'
          TEST_POSTGRES_PORT: '55432'
          TEST_REDIS_PORT: '57379'
          TEST_DATABASE_URL: postgresql://pulse_test:pulse_test_only_password@127.0.0.1:55432/pulse_test?schema=public
          CHAOS_REQUEST_COUNT: '1000'
        run: npm run test:chaos

      - name: Upload chaos outcomes and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-chaos-outcomes
          path: |
            e2e/test-results/chaos-report.json
            e2e/test-results/chaos-report/index.html
            e2e/test-results/chaos-artifacts/
          if-no-files-found: ignore
          retention-days: 7
